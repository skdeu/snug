[package]
name = "snug"
version = "1.3.2"
description = "A cozy Markdown reader for Windows: tabs, session restore, and a calm reading view."
authors = ["Sanjaykumar Sagadevan Vijayakumar"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "snug_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
